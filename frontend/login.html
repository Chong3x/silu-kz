<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 / 注册 · Silu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&family=Noto+Sans+SC:wght@400;500;700;900&family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

<header class="site-header">
  <div class="wrap header-inner">
    <a href="index.html" class="logo">
      <svg class="logo-mark" width="30" height="30" viewBox="0 0 34 34" fill="none">
        <path d="M17 2 L30 17 L17 32 L4 17 Z" stroke="currentColor" stroke-width="2"/>
        <circle cx="17" cy="17" r="5" stroke="currentColor" stroke-width="2"/>
      </svg>
      <span class="logo-text" data-i18n="siteName">Silu</span>
    </a>

    <div class="mobile-menu" id="mobileMenu">
    <nav class="main-nav">
      <a href="index.html" data-nav="home" data-i18n="navHome">首页</a>
      <a href="favorites.html" data-nav="favorites" data-i18n="navFavorites">收藏</a>
      <a href="profile.html" data-nav="profile" data-i18n="navProfile">我的发布</a>
      <a href="feedback.html" data-nav="feedback" data-i18n="navFeedback">意见反馈</a>
      <a href="referral.html" data-nav="referral" data-i18n="navReferral">分享有礼</a>
      <a href="admin.html" data-nav="admin" data-i18n="navAdmin" id="navAdminLink" hidden>管理后台</a>
    </nav>
      <nav class="lang-switch" aria-label="Language switch">
        <button class="lang-btn" data-lang="zh">中文</button>
        <button class="lang-btn" data-lang="ru">РУ</button>
        <button class="lang-btn" data-lang="kk">ҚАЗ</button>
        <button class="lang-btn" data-lang="en">EN</button>
      </nav>
    </div>
    <div class="header-right">
      <div class="auth-area" id="authArea"></div>
    </div>
    <button class="hamburger-btn" id="hamburgerBtn" aria-label="Menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>

<main class="wrap form-page">
  <div class="form-card" style="max-width:420px;">

    <p class="login-intro" data-i18n="loginIntro">欢迎回来，选择一种方式登录</p>

    <div class="google-btn-box">
      <div id="googleBtnWrap"></div>
    </div>
    <div class="login-divider" data-i18n="orDivider">或</div>

    <p class="phone-disabled-notice" data-i18n="phoneLoginDisabledNotice">📮 手机验证码登录暂时维护中，请使用上方 Google 登录。给您带来不便，敬请谅解。</p>

    <div class="auth-tabs">
      <button class="auth-tab active" id="tabLoginBtn" data-i18n="tabLogin">登录</button>
      <button class="auth-tab" id="tabRegisterBtn" data-i18n="tabRegister">注册</button>
    </div>

    <!-- 登录：仅手机号+验证码，不出现姓名输入框 -->
    <form id="loginForm" class="auth-form active">
      <h1 data-i18n="loginPageTitle">登录 Silu</h1>
      <div class="field-group">
        <label data-i18n="otpPhoneLabel">手机号</label>
        <div class="otp-row">
          <input type="tel" id="loginPhoneInput" placeholder="+7 700 000 0000" disabled required>
          <button type="button" class="btn btn-ghost" id="loginSendCodeBtn" data-i18n="otpSendBtn" disabled>获取验证码</button>
        </div>
      </div>
      <div class="field-group">
        <label data-i18n="otpCodeLabel">验证码</label>
        <input type="text" id="loginCodeInput" inputmode="numeric" maxlength="6" disabled required>
      </div>
      <p class="dev-otp-hint" id="loginDevHint" hidden></p>
      <p class="error-msg" id="loginError"></p>
      <div class="form-actions" style="justify-content:stretch;">
        <button type="submit" class="btn btn-post" style="width:100%; justify-content:center;" data-i18n="submitLogin" disabled>登录</button>
      </div>
    </form>

    <!-- 注册：手机号+验证码+姓名，独立表单 -->
    <form id="registerForm" class="auth-form">
      <h1 data-i18n="registerPageTitle">加入 Silu</h1>
      <div class="field-group">
        <label data-i18n="otpPhoneLabel">手机号</label>
        <div class="otp-row">
          <input type="tel" id="registerPhoneInput" placeholder="+7 700 000 0000" disabled required>
          <button type="button" class="btn btn-ghost" id="registerSendCodeBtn" data-i18n="otpSendBtn" disabled>获取验证码</button>
        </div>
      </div>
      <div class="field-group">
        <label data-i18n="otpCodeLabel">验证码</label>
        <input type="text" id="registerCodeInput" inputmode="numeric" maxlength="6" disabled required>
      </div>
      <div class="field-group">
        <label data-i18n="formName">姓名</label>
        <input type="text" id="registerNameInput" disabled required>
      </div>
      <p class="dev-otp-hint" id="registerDevHint" hidden></p>
      <p class="error-msg" id="registerError"></p>
      <div class="form-actions" style="justify-content:stretch;">
        <button type="submit" class="btn btn-post" style="width:100%; justify-content:center;" data-i18n="submitRegister" disabled>注册并登录</button>
      </div>
    </form>

    <p class="login-mode-switch"><a href="admin-login.html" data-i18n="goAdminLogin">我是管理员</a></p>
  </div>
</main>

<footer class="site-footer">
  <div class="wrap footer-inner">
    <div>
      <div class="logo-text footer-logo" data-i18n="siteName">Silu</div>
      <p class="footer-tagline" data-i18n="footerTagline">服务哈萨克斯坦华人社区的信息发布平台</p>
      <nav class="footer-nav">
        <a href="index.html" data-i18n="navHome">首页</a>
        <a href="favorites.html" data-i18n="navFavorites">收藏</a>
        <a href="profile.html" data-i18n="navProfile">我的发布</a>
        <a href="feedback.html" data-i18n="navFeedback">意见反馈</a>
        <a href="referral.html" data-i18n="navReferral">分享有礼</a>
        <a href="disclaimer.html" data-i18n="navDisclaimer">免责声明</a>
      </nav>
    </div>
    <div class="footer-right">
      <p class="footer-disclaimer-short" data-i18n="disclaimerShort">本站信息均由用户自行发布，平台不对内容真实性负责，交易前请自行核实。</p>
      <a class="footer-disclaimer-link" href="disclaimer.html" data-i18n="disclaimerReadMore">查看完整声明 →</a>
      <p class="footer-note" data-i18n="footerNote">万事顺遂</p>
    </div>
  </div>
</footer>

<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script src="common.js"></script>
<script src="login.js"></script>
</body>
</html>
