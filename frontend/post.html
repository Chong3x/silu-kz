<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>发布信息 · Silu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&family=Noto+Sans+SC:wght@400;500;700;900&family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap header-inner">
    <a href="index.html" class="logo">
      <svg class="logo-mark" width="30" height="30" viewBox="0 0 34 34" fill="none">
        <path d="M17 2 L30 17 L17 32 L4 17 Z" stroke="currentColor" stroke-width="2"/>
        <circle cx="17" cy="17" r="5" stroke="currentColor" stroke-width="2"/>
      </svg>
      <span class="logo-text" data-i18n="siteName">Silu</span>
    </a>

    <div class="mobile-menu" id="mobileMenu">
    <nav class="main-nav">
      <a href="index.html" data-nav="home" data-i18n="navHome">首页</a>
      <a href="favorites.html" data-nav="favorites" data-i18n="navFavorites">收藏</a>
      <a href="profile.html" data-nav="profile" data-i18n="navProfile">我的发布</a>
      <a href="feedback.html" data-nav="feedback" data-i18n="navFeedback">意见反馈</a>
      <a href="referral.html" data-nav="referral" data-i18n="navReferral">分享有礼</a>
      <a href="admin.html" data-nav="admin" data-i18n="navAdmin" id="navAdminLink" hidden>管理后台</a>
    </nav>
      <nav class="lang-switch" aria-label="Language switch">
        <button class="lang-btn" data-lang="zh">中文</button>
        <button class="lang-btn" data-lang="ru">РУ</button>
        <button class="lang-btn" data-lang="kk">ҚАЗ</button>
        <button class="lang-btn" data-lang="en">EN</button>
      </nav>
    </div>
    <div class="header-right">
      <div class="auth-area" id="authArea"></div>
    </div>
    <button class="hamburger-btn" id="hamburgerBtn" aria-label="Menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>

<main class="wrap form-page">
  <a href="index.html" class="back-link" data-i18n="backHome">← 返回首页</a>
  <div class="form-card">
    <h1 id="formHeading" data-i18n="postTitleNew">发布一条信息</h1>
    <form id="postForm">
      <div class="field-group">
        <label data-i18n="formCategory">分类</label>
        <select id="fCategory" required></select>
      </div>

      <div class="field-group">
        <label data-i18n="formTitleLabel">标题</label>
        <input type="text" id="fTitle" required data-i18n-ph="formTitlePh" placeholder="例如：市中心两居室出租">
      </div>

      <div class="field-row">
        <div class="field-group">
          <label data-i18n="formCity">城市</label>
          <select id="fCity" required></select>
        </div>
        <div class="field-group" id="contactGroup">
          <label data-i18n="formContact">联系方式</label>
          <input type="text" id="fContact" required data-i18n-ph="formContactPh" placeholder="微信 / WhatsApp / 电话">
        </div>
      </div>

      <div class="field-group">
        <label data-i18n="formDescription">详细描述</label>
        <textarea id="fDesc" rows="4" required></textarea>
      </div>

      <div class="field-group">
        <label data-i18n="uploadLabel">上传照片</label>
        <label class="photo-upload" id="photoDrop">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 8h3l1.5-2.2h7L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1Z"/><circle cx="12" cy="13" r="3.6"/></svg>
          <div class="photo-hint" data-i18n="uploadHint">最多 4 张，点击或拖拽图片到此处</div>
          <input type="file" id="fPhotos" accept="image/*" multiple>
        </label>
        <div class="photo-previews" id="photoPreviews"></div>
      </div>

      <div class="field-group" id="planSection">
        <label data-i18n="categoryLabel">发布方案</label>
        <div class="plan-options" id="planOptions"><!-- injected by JS --></div>
      </div>

      <div class="treasure-free-banner" id="treasureFreeBanner" hidden data-i18n="treasureFreeNotice">此类别不收取任何费用</div>

      <div class="kaspi-box" id="kaspiBox" hidden>
        <h4 data-i18n="kaspiPayTitle">Kaspi 转账信息</h4>
        <p class="page-desc" data-i18n="kaspiPayHint" style="margin-bottom:10px;">请按下方信息完成转账，然后上传转账截图，等待管理员确认后广告即可发布。</p>
        <div class="kaspi-row"><span data-i18n="kaspiPhoneLabel">收款手机号</span><span id="kaspiPhoneVal">-</span></div>
        <div class="kaspi-row"><span data-i18n="kaspiNameLabel">收款人姓名</span><span id="kaspiNameVal">-</span></div>
        <div class="field-group" style="margin-top:12px;">
          <label data-i18n="uploadPaymentScreenshot">上传转账截图</label>
          <input type="file" id="fPaymentScreenshot" accept="image/*">
        </div>
      </div>

      <p class="error-msg" id="formError"></p>

      <div class="form-actions">
        <a href="index.html" class="btn btn-ghost" data-i18n="formCancel">取消</a>
        <button type="submit" class="btn btn-post" id="submitBtn" data-i18n="formSubmit">发布</button>
      </div>
    </form>
  </div>
</main>

<footer class="site-footer">
  <div class="wrap footer-inner">
    <div>
      <div class="logo-text footer-logo" data-i18n="siteName">Silu</div>
      <p class="footer-tagline" data-i18n="footerTagline">服务哈萨克斯坦华人与哈萨克同胞的信息发布平台</p>
      <nav class="footer-nav">
        <a href="index.html" data-i18n="navHome">首页</a>
        <a href="favorites.html" data-i18n="navFavorites">收藏</a>
        <a href="profile.html" data-i18n="navProfile">我的发布</a>
        <a href="feedback.html" data-i18n="navFeedback">意见反馈</a>
        <a href="referral.html" data-i18n="navReferral">分享有礼</a>
        <a href="disclaimer.html" data-i18n="navDisclaimer">免责声明</a>
      </nav>
    </div>
    <div class="footer-right">
      <p class="footer-disclaimer-short" data-i18n="disclaimerShort">本站信息均由用户自行发布，平台不对内容真实性负责，交易前请自行核实。</p>
      <a class="footer-disclaimer-link" href="disclaimer.html" data-i18n="disclaimerReadMore">查看完整声明 →</a>
      <p class="footer-note" data-i18n="footerNote">万事顺遂</p>
    </div>
  </div>
</footer>

<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script src="common.js"></script>
<script src="post.js"></script>
</body>
</html>
