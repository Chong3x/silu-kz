<link rel="stylesheet" href="style.css">

<body>

<header class="site-header">
  <div class="wrap header-inner">
    <a href="index.html" class="logo">
      <svg class="logo-mark" width="30" height="30" viewBox="0 0 34 34" fill="none">
        <path d="M17 2 L30 17 L17 32 L4 17 Z" stroke="currentColor" stroke-width="2"/>
        <circle cx="17" cy="17" r="5" stroke="currentColor" stroke-width="2"/>
      </svg>
      <span class="logo-text" data-i18n="siteName">Silu</span>
    </a>


    <div class="mobile-menu" id="mobileMenu">
    <nav class="main-nav">
      <a href="index.html" data-nav="home" data-i18n="navHome">首页</a>
      <a href="favorites.html" data-nav="favorites" data-i18n="navFavorites">收藏</a>
      <a href="profile.html" data-nav="profile" data-i18n="navProfile">我的发布</a>
      <a href="feedback.html" data-nav="feedback" data-i18n="navFeedback">意见反馈</a>
      <a href="referral.html" data-nav="referral" data-i18n="navReferral">分享有礼</a>
      <a href="admin.html" data-nav="admin" data-i18n="navAdmin" id="navAdminLink" hidden>管理后台</a>
    </nav>
      <nav class="lang-switch" aria-label="Language switch">
        <button class="lang-btn" data-lang="zh">中文</button>
        <button class="lang-btn" data-lang="ru">РУ</button>
        <button class="lang-btn" data-lang="kk">ҚАЗ</button>
        <button class="lang-btn" data-lang="en">EN</button>
      </nav>
    </div>
    <div class="header-right">
      <div class="auth-area" id="authArea"></div>
      <a href="post.html" class="btn btn-post" data-i18n="navPost">发布信息</a>
    </div>
    <button class="hamburger-btn" id="hamburgerBtn" aria-label="Menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>

<main id="top">
  <div class="wrap">
    <div class="promo-banner" data-i18n="homeBanner">📢 首次发广告免费！分享朋友圈满24小时再送1次免费发布机会</div>
  </div>

  <section class="hero">
    <div class="wrap hero-inner">
      <p class="eyebrow" data-i18n="heroEyebrow">哈萨克斯坦 · 华人与哈萨克同胞生活信息平台</p>
      <h1 class="hero-title" data-i18n="heroTitle">连接在哈萨克斯坦的每一位华人与哈萨克同胞</h1>
      <p class="hero-sub" data-i18n="heroSub">找室友、找房子、找工作、找合作伙伴 — 一个属于华人与哈萨克同胞的信息集散地</p>

      <form class="search-bar" id="searchForm">
        <input type="text" id="searchInput" data-i18n-ph="searchPlaceholder" placeholder="搜索：城市、职位、房源关键词…">
        <button type="submit" class="btn btn-post" data-i18n="searchBtn">搜索</button>
      </form>

      <div class="hero-stats">
        <div class="stat"><span class="stat-num" id="statListings">0</span><span class="stat-label" data-i18n="statListings">条信息</span></div>
        <div class="stat"><span class="stat-num" id="statCities">0</span><span class="stat-label" data-i18n="statCities">座城市</span></div>
        <div class="stat"><span class="stat-num" id="statCats">0</span><span class="stat-label" data-i18n="statCats">大分类</span></div>
      </div>
    </div>
  </section>

  <section class="categories wrap">
    <div class="panel-card">
      <h2 class="section-title" data-i18n="catSectionTitle">按分类浏览</h2>
      <div class="cat-grid" id="catGrid"><!-- injected by JS --></div>
    </div>
  </section>

  <section class="listings wrap">
    <div class="panel-card">
      <div class="listings-head">
        <h2 class="section-title" id="listingsTitle" data-i18n="allListings">全部信息</h2>
        <span id="daysLegendSlot"></span>
        <button class="chip chip-clear" id="clearFilter" hidden data-i18n="clearFilter">清除筛选 ✕</button>
      </div>
      <div class="listing-grid" id="listingGrid"><!-- injected by JS --></div>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="wrap footer-inner">
    <div>
      <div class="logo-text footer-logo" data-i18n="siteName">Silu</div>

      <p class="footer-note" data-i18n="footerNote">万事顺遂</p>

</footer>

<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script src="common.js"></script>
<script src="home.js"></script>
